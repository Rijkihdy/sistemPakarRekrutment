<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #4C6EF5, #6A82FB);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background: white;
            width: 380px;
            padding: 40px 35px;
            border-radius: 15px;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.15);
            animation: fadeIn 0.4s ease;
        }

        h2 {
            margin: 0 0 20px;
            font-weight: 600;
            text-align: center;
            color: #333;
        }

        label {
            font-size: 14px;
            color: #444;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            margin-top: 6px;
            margin-bottom: 18px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            transition: 0.2s;
        }

        input:focus {
            border-color: #4C6EF5;
            box-shadow: 0 0 4px rgba(76,110,245,0.4);
        }

        button {
            width: 100%;
            padding: 12px;
            background: #4C6EF5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #3b5bdb;
        }

        .error {
            text-align: center;
            font-size: 14px;
            color: red;
            margin-top: 10px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

    <div class="login-card">
        <h2>Login</h2>

        <form method="POST">
            {{ form.hidden_tag() }}

            <label>Username</label>
            {{ form.username(class="input-field") }}

            <label>Password</label>
            {{ form.password(class="input-field") }}

            <button type="submit">Login</button>
        </form>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
    </div>

</body>
</html>
