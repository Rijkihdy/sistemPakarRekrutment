{% extends 'layout.html' %}

{% block content %}
    <h1>Tambah Kandidat</h1>
    <form method="POST" class="card">
        {{ form.hidden_tag() }}

        <div class="form-grid">
            <div>
                <div class="form-group">
                    <label for="name">Nama Kandidat</label>
                    {{ form.name() }}
                </div>
                <div class="form-group">
                    <label for="experience">Pengalaman Kerja</label>
                    {{ form.experience() }}
                </div>
            </div>

            <div>
                <div class="form-group">
                    <label for="job_position">Posisi yang Dilamar</label>
                    {{ form.job_position() }}
                </div>
                <div class="form-group">
                    <label for="culture_fit">Kesesuaian Budaya</label>
                    {{ form.culture_fit() }}
                </div>
            </div>

            <div class="full">
                <div class="form-group">
                    <label for="education">Pendidikan</label>
                    {{ form.education() }}
                </div>
            </div>

            <div class="full">
                <div class="form-group">
                    <label for="skills">Keterampilan (pisahkan koma)</label>
                    {{ form.skills() }}
                </div>
            </div>
        </div>

        <div class="form-actions">
            {{ form.submit(class='btn') }}
            <a class="btn secondary" href="{{ url_for('data_kandidat') }}">Batal</a>
        </div>
    </form>
{% endblock %}
